<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Tables are used to represent real life table data. -->
    <!-- tr => use to display create row -->
    <!-- td => used to display table data -->
    <!-- th => used to display table header -->
    <!-- thead => to wrap table header  -->
    <!-- tbody => to wrap table body  -->
    <!-- tfoot => to wrap  -->
    <table border="black">
        <caption>Food Menu</caption>
        <thead>
            <tr>
                <th>item</th>
                <td>Price</td>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Frooti</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Samosa</td>
                <td>12</td>
            </tr>
            <tr>
                <td>Chips</td>
                <td>20</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
